format = """
$directory$git_branch
$username@$hostname $character
"""

[username]
show_always = true
style_user = "fg:146 bold"
style_root = "fg:203 bold"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "fg:111"
format = "[$hostname]($style)"

[directory]
style = "fg:255 bold"
format = "[$path]($style)"
truncation_length = 1
truncate_to_repo = false
truncation_symbol = "⋯/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = " "
style = "fg:250"
format = "  [$symbol$branch]($style)"

[fill]
symbol = " "

[time]
disabled = false
time_format = "%R"
style = "fg:146"
format = "[ $time]($style)"

[character]
success_symbol = "[❯](fg:111)"
error_symbol = "[❯](fg:203)"
